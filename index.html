<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Snack Bar POS</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">CAMPUS SNACK BAR</p>
      <h1>Point of Sale</h1>
      <p>Select a snack and build your order.</p>
    </div>
  </header>

  <main class="container pos-layout">
    <section class="panel" aria-labelledby="products-heading">
      <div class="panel-heading">
        <h2 id="products-heading">Product List</h2>
        <span class="badge">6 products</span>
      </div>
      <div id="product-list" class="product-grid"></div>
    </section>

    <section class="panel cart-panel" aria-labelledby="cart-heading">
      <div class="panel-heading">
        <h2 id="cart-heading">Shopping Cart / Order Summary</h2>
      </div>
      <p id="cart-count" class="cart-count">0 items in your order</p>
      <div id="cart-items" class="cart-items"></div>
      <div class="total-row" aria-live="polite" aria-atomic="true">
        <span>Total Amount</span>
        <strong id="total-amount">₱0.00</strong>
      </div>
      <form id="payment-form" class="payment-form" novalidate>
        <label for="cash-payment">Cash Payment</label>
        <input id="cash-payment" name="cash-payment" type="number" min="0" step="0.01"
          placeholder="Enter amount in pesos" aria-describedby="payment-error" required>
        <p id="payment-error" class="error-message" role="alert" hidden></p>
        <button id="confirm-payment" class="add-button" type="submit">Confirm Payment</button>
      </form>
      <p id="payment-success" class="success-message" role="status" hidden></p>
      <section id="receipt" class="receipt" aria-labelledby="receipt-heading" hidden>
        <h2 id="receipt-heading">Digital Receipt</h2>
        <p class="receipt-reference">Reference: <strong id="receipt-reference"></strong></p>
        <div id="receipt-items"></div>
        <dl class="receipt-totals">
          <div><dt>Total</dt><dd id="receipt-total"></dd></div>
          <div><dt>Amount Paid</dt><dd id="receipt-paid"></dd></div>
          <div><dt>Change</dt><dd id="receipt-change"></dd></div>
        </dl>
      </section>
      <button id="new-transaction" class="new-transaction" type="button">Start New Transaction</button>
    </section>
  </main>
  <p id="status-message" class="sr-only" role="status"></p>
</body>
</html>
